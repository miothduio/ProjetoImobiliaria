<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${assunto}">Aviso</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f4f7; font-family:Arial, Helvetica, sans-serif; color:#333333;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f4f7; padding:24px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:600px; background-color:#ffffff; border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.06);">

        <tr>
          <td style="background-color:#1f3a5f; padding:24px 32px;">
            <p style="margin:0; color:#ffffff; font-size:20px; font-weight:bold;">Imobiliária</p>
            <p style="margin:4px 0 0; color:#c9d6e8; font-size:13px;">Novidade sobre a sua negociação</p>
          </td>
        </tr>

        <tr>
          <td style="padding:28px 32px 8px; font-size:15px; line-height:1.6;">
            <p style="margin:0 0 12px;">Olá, <strong th:text="${nomeCliente}">cliente</strong>!</p>
            <h2 style="margin:0 0 12px; font-size:20px; color:#1f3a5f;" th:text="${titulo}">Título</h2>
            <p style="margin:0 0 12px;" th:text="${mensagem}">Mensagem</p>
          </td>
        </tr>

        <tr th:if="${detalhe}">
          <td style="padding:0 32px 8px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f3ee; border-radius:8px;">
              <tr>
                <td style="padding:14px 20px; font-size:14px; line-height:1.6; white-space:pre-line;" th:text="${detalhe}">Detalhe</td>
              </tr>
            </table>
          </td>
        </tr>

        <tr th:if="${rotuloBotao}">
          <td style="padding:16px 32px 28px;">
            <a th:href="${link}" th:text="${rotuloBotao}"
               style="display:inline-block; background-color:#c9733a; color:#ffffff; text-decoration:none; font-weight:bold; padding:12px 22px; border-radius:6px;">Abrir</a>
          </td>
        </tr>

        <tr>
          <td style="padding:16px 32px 24px; border-top:1px solid #eeeeee; font-size:12px; color:#8a8f98;">
            Este é um aviso automático do site da Imobiliária. Para falar com um corretor, responda pelo formulário de contato do site.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

</body>
</html>
