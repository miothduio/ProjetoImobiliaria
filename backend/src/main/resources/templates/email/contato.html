<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${assunto}">Contato pelo site</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f4f7; font-family:Arial, Helvetica, sans-serif; color:#333333;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f4f7; padding:24px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:600px; background-color:#ffffff; border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.06);">

        <tr>
          <td style="background-color:#1f3a5f; padding:24px 32px;">
            <p style="margin:0; color:#ffffff; font-size:20px; font-weight:bold;">Imobiliária</p>
            <p style="margin:4px 0 0; color:#c9d6e8; font-size:13px;">Nova mensagem pelo site</p>
          </td>
        </tr>

        <!-- Quem escreveu -->
        <tr>
          <td style="padding:28px 32px 8px;">
            <h2 style="margin:0 0 14px; font-size:20px; color:#1f3a5f;" th:text="${assunto}">Assunto</h2>
            <table role="presentation" cellpadding="0" cellspacing="0" style="font-size:14px; line-height:1.7;">
              <tr>
                <td style="color:#6b7280; padding-right:12px;">Nome</td>
                <td style="font-weight:bold;" th:text="${nome}">Cliente</td>
              </tr>
              <tr>
                <td style="color:#6b7280; padding-right:12px;">E-mail</td>
                <td><a th:href="'mailto:' + ${email}" th:text="${email}" style="color:#1f3a5f;">email</a></td>
              </tr>
              <tr th:if="${telefone}">
                <td style="color:#6b7280; padding-right:12px;">Telefone</td>
                <td th:text="${telefone}">telefone</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Imóvel (só no contato feito pela página de um imóvel) -->
        <tr th:if="${temImovel}">
          <td style="padding:16px 32px 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="background-color:#f6f3ee; border-radius:8px;">
              <tr>
                <td style="padding:16px 20px; font-size:14px; line-height:1.6;">
                  <p style="margin:0 0 4px; color:#c9733a; font-size:12px; font-weight:bold; text-transform:uppercase;">
                    Imóvel cód. <span th:text="${imovelCodigo}">1</span>
                  </p>
                  <p style="margin:0; font-weight:bold; font-size:16px;" th:text="${imovelTitulo}">Título</p>
                  <p style="margin:2px 0 0; color:#6b7280;">
                    <span th:text="${imovelTipo}">Tipo</span><span th:if="${imovelBairro}"> · </span><span th:text="${imovelBairro}">Bairro</span><span th:if="${imovelCidade}">, </span><span th:text="${imovelCidade}">Cidade</span>
                  </p>
                  <p style="margin:6px 0 0;">
                    <span th:if="${imovelVenda}">Venda: <strong th:text="${imovelVenda}">R$</strong></span>
                    <span th:if="${imovelVenda != null and imovelAluguel != null}"> · </span>
                    <span th:if="${imovelAluguel}">Aluguel: <strong th:text="${imovelAluguel}">R$</strong>/mês</span>
                  </p>
                  <p style="margin:10px 0 0;">
                    <a th:href="${imovelLink}" style="color:#1f3a5f; font-weight:bold;">Ver o imóvel no site</a>
                  </p>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Mensagem escrita (e editada) pelo cliente -->
        <tr>
          <td style="padding:20px 32px 8px;">
            <p style="margin:0 0 6px; color:#6b7280; font-size:13px;">Mensagem</p>
            <p style="margin:0; font-size:15px; line-height:1.6; white-space:pre-line;" th:text="${mensagem}">Mensagem</p>
          </td>
        </tr>

        <tr>
          <td style="padding:20px 32px 28px; font-size:12px; color:#6b7280; border-top:1px solid #eeeeee;">
            Use "Responder" para falar direto com o cliente: a resposta vai para <span th:text="${email}">email</span>.
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>

</body>
</html>
