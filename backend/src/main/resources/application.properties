spring.application.name=demo

# Segredos (senha do e-mail, chave JWT) ficam no arquivo backend/.env, fora do Git.
# Copie .env.example para .env e preencha. Rode o projeto a partir da pasta backend/.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/restaurante
spring.datasource.username=root
spring.datasource.password=


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#JWT
# Chave usada para assinar os tokens (em produção, defina a variável de ambiente JWT_SECRET)
api.security.token.secret=${JWT_SECRET:imobiliaria-chave-secreta-trocar-em-producao-2026}
api.security.token.expiracao-horas=2

# ADMIN inicial (criado automaticamente se não existir nenhum ADMIN no banco)
app.admin.email=admin@admin.com
app.admin.senha=admin123

#FOTOS
app.upload-dir=./uploads
spring.servlet.multipart.enabled=true

#email
spring.mail.host=smtp.mailgun.org
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true

#CORS (front-end React + Vite). Separe várias origens por vírgula.
app.cors.origens=http://localhost:5173,http://127.0.0.1:5173
